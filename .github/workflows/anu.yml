name: ginkgo-main
on:
  workflow_dispatch:
    inputs:
      repo:
          description: 'Kernel source link (dont include . git at the end)'
          default: 'https://github.com/malkist01/G4.git'
          required: true
      branch:
          description: 'Kernel source branch'
          default: 'master'
          required: true
          
env:
  TZ: Asia/Jakarta
  REPO: ${{ github.event.inputs.repo }}
  BRANCH: ${{ github.event.inputs.branch }}
      
jobs:
  kernel-build:
       runs-on: ubuntu-latest

       steps:
       - name: Setting up env!
         run: |
              sudo -E apt-get -qq update
              sudo -E apt-get -qq install git make bc bison -y ccache \
              openssl curl zip kmod cpio flex libelf-dev \
              libssl-dev libtfm-dev wget device-tree-compiler \
              ca-certificates python3 binutils \
              binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
       - name: Building Kernel...
         run: |
             wget https://raw.githubusercontent.com/malkist01/build/main/scripts/build.sh
             bash build.sh
